name: Build PathGuard LKM Probe

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pattern-redirect-v6
    paths:
      - .github/workflows/build-pathguard-probe.yml
      - experimental/hide-vfs/probe/**
      - experimental/hide-vfs/loader/**
      - tests/unit/hide_loader_fixture.h
      - tests/unit/hide_loader_test.cpp
      - tests/unit/restricted_loader_test.cpp

permissions:
  contents: read

env:
  DDK_IMAGE: ghcr.io/ylarod/ddk-min:android16-6.12-20260828
  KMI: android16-6.12
  OFFLINE_TEST_VERMAGIC: 6.12.23-android16-5-g16e473de48a3-abogki462654244-4k SMP preempt mod_unload modversions aarch64

jobs:
  build-restricted-loader:
    runs-on: ubuntu-latest

    steps:
      - name: Check out PathGuard
        uses: actions/checkout@v6

      - name: Run host loader tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/pathguard-loader
          common=(
            -std=c++20 -Wall -Wextra -Werror
            -Iexperimental/hide-vfs/loader
            -Itests/unit
            experimental/hide-vfs/loader/offline_module_adapter.cpp
            experimental/hide-vfs/loader/restricted_loader.cpp
          )
          clang++ "${common[@]}" tests/unit/hide_loader_test.cpp \
            -o out/pathguard-loader/hide_loader_test
          clang++ "${common[@]}" tests/unit/restricted_loader_test.cpp \
            -o out/pathguard-loader/restricted_loader_test
          out/pathguard-loader/hide_loader_test
          out/pathguard-loader/restricted_loader_test

      - name: Build Android arm64 prepare-only loader
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_NDK_LATEST_HOME:?GitHub runner must provide an Android NDK}"
          toolchain="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cxx="$toolchain/aarch64-linux-android26-clang++"
          readelf="$toolchain/llvm-readelf"
          nm="$toolchain/llvm-nm"
          test -x "$cxx"
          "$cxx" -std=c++20 -Wall -Wextra -Werror -static-libstdc++ \
            -fPIE -pie -Iexperimental/hide-vfs/loader \
            experimental/hide-vfs/loader/offline_module_adapter.cpp \
            experimental/hide-vfs/loader/restricted_loader.cpp \
            experimental/hide-vfs/loader/restricted_loader_main.cpp \
            -o out/pathguard-loader/pathguard_lkm_loader-android-arm64

          binary=out/pathguard-loader/pathguard_lkm_loader-android-arm64
          "$readelf" -hW "$binary" > out/pathguard-loader/elf-header.txt
          "$readelf" -dW "$binary" > out/pathguard-loader/elf-dynamic.txt
          "$nm" -u "$binary" > out/pathguard-loader/undefined-symbols.txt
          sha256sum "$binary" > out/pathguard-loader/sha256.txt
          printf '%s\n' "$ANDROID_NDK_LATEST_HOME" \
            > out/pathguard-loader/android-ndk.txt
          printf '%s\n' "$GITHUB_SHA" > out/pathguard-loader/pathguard-commit.txt

          grep -Eq 'Type:[[:space:]]+DYN' out/pathguard-loader/elf-header.txt
          grep -Eq 'Machine:[[:space:]]+AArch64' out/pathguard-loader/elf-header.txt
          ! grep -Eq 'libc\+\+_shared\.so' out/pathguard-loader/elf-dynamic.txt
          ! grep -Eq '(^|[[:space:]])(init_module|finit_module)($|[[:space:]@])' \
            out/pathguard-loader/undefined-symbols.txt
          ! grep -Raq '/proc/sys/kernel/kptr_restrict' "$binary"

      - name: Upload restricted loader report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pathguard-loader-android16-6.12
          path: out/pathguard-loader/
          if-no-files-found: error
          retention-days: 14

  build-probe:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828

    steps:
      - name: Check out PathGuard
        uses: actions/checkout@v6

      - name: Validate DDK environment
        shell: bash
        run: |
          set -euo pipefail
          : "${KDIR:?The DDK image must export KDIR}"
          test "$(basename "${KDIR%/}")" = "$KMI"
          test -f "$KDIR/Makefile"
          test -f "$KDIR/vmlinux"
          command -v clang
          command -v llvm-readelf
          command -v llvm-nm
          command -v llvm-strip
          {
            echo "ddk_image=$DDK_IMAGE"
            echo "kdir=$KDIR"
            echo "kmi=$KMI"
            clang --version | head -n 1
          } | tee "$GITHUB_WORKSPACE/ddk-environment.txt"

      - name: Build minimal probe
        shell: bash
        working-directory: experimental/hide-vfs/probe
        run: |
          set -euo pipefail
          CC=clang make
          test -s pathguard_probe.ko

      - name: Inspect and validate ELF
        shell: bash
        run: |
          set -euo pipefail
          module="$GITHUB_WORKSPACE/experimental/hide-vfs/probe/pathguard_probe.ko"
          report="$GITHUB_WORKSPACE/out/pathguard-probe"
          mkdir -p "$report"

          cp "$module" "$report/pathguard_probe.unstripped.ko"
          llvm-strip -d -o "$report/pathguard_probe.ko" "$module"

          llvm-readelf -hW "$report/pathguard_probe.ko" > "$report/elf-header.txt"
          llvm-readelf -SW "$report/pathguard_probe.ko" > "$report/elf-sections.txt"
          llvm-readelf -sW "$report/pathguard_probe.ko" > "$report/elf-symbols.txt"
          llvm-readelf -p .modinfo "$report/pathguard_probe.ko" > "$report/modinfo.txt"
          llvm-nm -u --format=posix "$report/pathguard_probe.ko" \
            | awk '{print $1}' | sort -u > "$report/undefined-symbols.txt"
          llvm-nm --defined-only --format=posix "$KDIR/vmlinux" \
            | awk '{print $1}' | sort -u > "$report/vmlinux-defined-symbols.txt"
          comm -23 "$report/undefined-symbols.txt" \
            "$report/vmlinux-defined-symbols.txt" > "$report/missing-symbols.txt"

          versions_size="$({
            llvm-readelf -SW "$report/pathguard_probe.ko" \
              | awk '$2 == "__versions" { print $6; found=1 } END { if (!found) print "MISSING" }'
          })"
          printf '%s\n' "$versions_size" > "$report/versions-size-hex.txt"

          grep -E '^(CONFIG_|# CONFIG_)(ARM64|MODULES|MODVERSIONS|MODULE_SIG|MODULE_SIG_FORCE|CFI_CLANG|CFI_ICALL_NORMALIZE_INTEGERS|LTO_NONE)(=| is not set)' \
            "$KDIR/.config" > "$report/kconfig-selection.txt" || true

          clang++ -std=c++20 -Wall -Wextra -Werror \
            -I"$GITHUB_WORKSPACE/experimental/hide-vfs/loader" \
            "$GITHUB_WORKSPACE/experimental/hide-vfs/loader/offline_module_adapter.cpp" \
            "$GITHUB_WORKSPACE/experimental/hide-vfs/loader/offline_adapter_main.cpp" \
            -o "$report/pathguard_lkm_offline_adapter"
          test "$(wc -l < "$report/undefined-symbols.txt")" -eq 1
          grep -qx 'init_uts_ns' "$report/undefined-symbols.txt"
          llvm-nm --defined-only --format=posix "$KDIR/vmlinux" \
            > "$report/vmlinux-symbols-posix.txt"
          : > "$report/kernel-symbol-fixture.txt"
          while IFS= read -r symbol; do
            awk -v wanted="$symbol" \
              '$1 == wanted { print $3, $2, $1; found=1; exit } END { if (!found) exit 1 }' \
              "$report/vmlinux-symbols-posix.txt" \
              >> "$report/kernel-symbol-fixture.txt"
          done < "$report/undefined-symbols.txt"
          "$report/pathguard_lkm_offline_adapter" \
            "$report/pathguard_probe.ko" \
            "$report/kernel-symbol-fixture.txt" \
            "$OFFLINE_TEST_VERMAGIC" \
            "$report/pathguard_probe.offline-adapted-do-not-load.ko" \
            | tee "$report/offline-adapter.txt"
          grep -q '^relocated=1$' "$report/offline-adapter.txt"
          grep -q "^vermagic_after=$OFFLINE_TEST_VERMAGIC$" \
            "$report/offline-adapter.txt"
          test -s "$report/pathguard_probe.offline-adapted-do-not-load.ko"

          if tail -c 64 "$report/pathguard_probe.ko" | grep -aq '~Module signature appended~'; then
            echo present > "$report/module-signature.txt"
          else
            echo absent > "$report/module-signature.txt"
          fi

          sha256sum "$report/pathguard_probe.ko" \
            "$report/pathguard_probe.unstripped.ko" > "$report/sha256.txt"
          printf '%s\n' "${GITHUB_SHA}" > "$report/pathguard-commit.txt"

          gate=0
          grep -Eq 'Machine:[[:space:]]+AArch64' "$report/elf-header.txt" || {
            echo "ERROR: module is not AArch64" >&2
            gate=1
          }
          grep -q 'vermagic=' "$report/modinfo.txt" || {
            echo "ERROR: module has no vermagic" >&2
            gate=1
          }
          if test -s "$report/missing-symbols.txt"; then
            echo "ERROR: module has symbols missing from DDK vmlinux:" >&2
            cat "$report/missing-symbols.txt" >&2
            gate=1
          fi
          if test "$versions_size" != "000000"; then
            echo "ERROR: __versions size is $versions_size, expected 000000" >&2
            gate=1
          fi
          exit "$gate"

      - name: Upload probe and inspection report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pathguard-probe-android16-6.12
          path: |
            out/pathguard-probe/
            ddk-environment.txt
          if-no-files-found: error
          retention-days: 14
