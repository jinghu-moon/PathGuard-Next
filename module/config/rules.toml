# PathGuard rules format 2.
format = 2

[compatibility]
allow_legacy_mount = true

[apps."org.localsend.localsend_app"]
users = [0]
provider = { enabled = true }
deny_rules = [
    { select = { root = "Pictures", glob = "Nagram", type = "directory" } },
    { select = { root = "DCIM", glob = "Screenshots", type = "directory" } },
]
redirect_rules = [
    { select = { root = "Download", glob = "localsend-source", type = "directory" }, to = "Download/localsend-redirect" },
    { select = { root = "Download/localsend-source", glob = "**", type = "file" }, to = "Download/localsend-redirect" },
    { select = { root = "Download/localsend-source", glob = "**", type = "file" }, to = "Download/localsend-redirect", enforcement = "provider", audit = true },
    { select = { root = "Pictures", glob = "**", type = "file" }, to = "Download/localsend-redirect" },
    { select = { root = "Pictures", glob = "**", type = "file" }, to = "Download/localsend-redirect", enforcement = "provider", audit = true },
]

# Experimental Hide 1.0-LKM rule. It is independently admitted and only
# activates while this package process is present on the fixed test device.
[apps."dev.pathguard.hideprobe.target"]
users = [0]
hide_rules = [
    { parent = "/storage/emulated/0/Pictures/PathGuardHideLab/20260925-000308", basename = "hidden" },
]
